task_node:
  ros__parameters:
    max_seat_number: 0
    state_machine:
      before_patrol_wait_sec: 3.0
    face_recognition:
      image_timeout_sec: 15.0
      judgment_timeout_sec: 60.0
      image_republish_interval_sec: 1.0
    nanpa_presence:
      image_timeout_sec: 15.0
      gemini_model: gemini-2.5-flash
      jpeg_quality: 85
      api_key_env: GEMINI_API_KEY
    nanpa:
      qr_timeout_sec: 15.0
    navigation:
      action_name: /navigate_to_pose
      frame_id: map
      timeout_sec: 90.0
      action_server_timeout_sec: 30.0
      goal_response_timeout_sec: 60.0
      seats_json: '{"1": {"id": "1", "x": 1.34, "y": -0.087, "yaw": -0.12 }, 
                    "2": {"id": "2", "x": 0.55, "y": -0.075, "yaw": -0.12 },
                    "3": {"id": "3", "x": 1.34, "y": -0.845, "yaw": -0.12}, 
                    "4": {"id": "8", "x": 0.514, "y": -0.795, "yaw": -0.12 }
                    }'
      scan_route_json: '["1", "2","3","4"]'
      default_route_json: '[]'
      default_goal_json: '{"id": "home", "x": 0.0, "y": 0.0, "yaw": 0.0}'
